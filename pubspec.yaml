name: offline_mesh_messenger
description: Phase 4 local-first Android messenger UI and WebRTC calling foundation.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.1
  qr_flutter: ^4.1.0
  flutter_webrtc: ^0.12.12
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
